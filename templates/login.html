<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Biblioteca</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6f8fb; }
        .login-container { max-width: 400px; margin-top: 10vh; }
        .btn-primary { background-color: #1d4e89; border-color: #1d4e89; }
        .btn-primary:hover { background-color: #153b69; border-color: #153b69; }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 text-primary fw-bold">Biblioteca Escolar</h3>
                
                {% if form.errors %}
                    <div class="alert alert-danger p-2 text-center" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label text-muted fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
